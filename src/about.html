<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About Cambuz PDF Reader</title>
  <link rel="icon" type="image/png" href="../assets/icon.png">
  <style>
    /* Self-contained About dialog, styled with the Cambuz (Catppuccin Mocha)
       palette used by src/styles.css so it matches the reader. */
    :root {
      color-scheme: dark;
      --bg-primary: #1e1e2e;
      --bg-surface: #313244;
      --bg-hover: #45475a;
      --text-primary: #cdd6f4;
      --text-secondary: #a6adc8;
      --text-muted: #6c7086;
      --accent: #89b4fa;
      --border: #45475a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 28px 20px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }
    .logo {
      width: 112px;
      height: 112px;
      border-radius: 24px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin-top: 16px;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .version {
      margin-top: 2px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .tagline {
      margin-top: 14px;
      font-size: 14px;
      color: var(--text-primary);
    }
    .meta {
      margin-top: 12px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .meta a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .meta a:hover, .meta a:focus-visible {
      color: #b4d0fb;
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 3px;
    }
    footer {
      margin-top: 16px;
      color: var(--text-muted);
      font-size: 12px;
    }
    button {
      margin-top: 18px;
      padding: 7px 22px;
      font: inherit;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: var(--bg-hover); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <img class="logo" src="../assets/icon.png" alt="Cambuz PDF Reader application icon">
  <h1>Cambuz PDF Reader</h1>
  <p class="version" id="version"></p>
  <p class="tagline">PDF reading without the bloat.</p>
  <p class="meta">Developed by <strong>Rajesh Singh</strong></p>
  <p class="meta">
    Official website:
    <a href="https://pixldot.com/" target="_blank" rel="noopener noreferrer">https://pixldot.com/</a>
  </p>
  <footer>Copyright © 2026 Cambuz · MIT License</footer>
  <button id="close" type="button">Close</button>
  <script>
    // The version is supplied by the main process from app.getVersion() — the
    // running application/package version. Never hard-code a release number in
    // this page. (No preload is exposed to this sandboxed page; it runs with
    // Node integration off and context isolation on, like the main window.)
    const version = new URLSearchParams(window.location.search).get('version') || '';
    const label = document.getElementById('version');
    if (version) label.textContent = `Version ${version}`;

    document.getElementById('close').addEventListener('click', () => window.close());
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') window.close();
    });
  </script>
</body>
</html>
